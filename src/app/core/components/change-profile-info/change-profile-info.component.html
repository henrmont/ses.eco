<h2 mat-dialog-title>Alterar informações do perfil</h2>

<form [formGroup]="changeProfileInfoForm">
  <mat-dialog-content>
    
    <div class="line">
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>
        <input matInput type="text" formControlName="name">
        @for (item of errorMessages['name']; track $index) {
          <mat-error [hidden]="!changeProfileInfoForm.get('name')?.hasError(item.type)">
            {{ item.message }}
          </mat-error>
        }
      </mat-form-field>
    </div>

  </mat-dialog-content>
  
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false" [disabled]="isSubmitting()">
      Fechar
    </button>
    <button 
      mat-flat-button 
      color="primary" 
      type="button" 
      [disabled]="changeProfileInfoForm.invalid || changeProfileInfoForm.pending || changeProfileInfoForm.pristine || isSubmitting()"
      (click)="onSubmit()"
    >
      <div class="waiting">
        @if (isSubmitting()) {
          <mat-spinner [diameter]="20"></mat-spinner>
        }
        <span>Salvar alterações</span>
      </div>
    </button>
  </mat-dialog-actions>
</form>
