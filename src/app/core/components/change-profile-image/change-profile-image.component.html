<h2 mat-dialog-title>Alterar imagem do perfil</h2>

<form [formGroup]="changeProfileImageForm">
  <mat-dialog-content class="cropper-content">
    
    <image-cropper 
      class="cropper"
      [imageChangedEvent]="imageChangedEvent"
      [maintainAspectRatio]="true"
      [aspectRatio]="1 / 1"
      [roundCropper]="true"
      format="png"
      output="base64"
      [resizeToWidth]="600"
      [resizeToHeight]="600"
      [cropperMinWidth]="600"
      [cropperMinHeight]="600"
      (imageCropped)="imageCropped($event)"
      (imageLoaded)="imageLoaded($event)"
      (cropperReady)="cropperReady()"
      (loadImageFailed)="loadImageFailed()">
    </image-cropper>

  </mat-dialog-content>
  
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="false" [disabled]="isSubmitting()">
      Fechar
    </button>
    <button 
      mat-flat-button 
      color="primary" 
      type="button" 
      [disabled]="changeProfileImageForm.invalid || isSubmitting()"
      (click)="onSubmit()">
      <div class="waiting">
        @if (isSubmitting()) {
          <mat-spinner [diameter]="20"></mat-spinner>
        }
        <span>Alterar</span>
      </div>
    </button>
  </mat-dialog-actions>
</form>
