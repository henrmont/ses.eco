<h2 mat-dialog-title>Selecionar módulo</h2>
<mat-dialog-content>
  <mat-action-list>
  <!-- Alterado aqui: usando filteredModules -->
  @for (item of filteredModules; track item.id) {
    <button mat-list-item (click)="changeProfileModule(item.id)" [disabled]="checkModule(item.id)">
      <div class="list-item">
        <div>
          <mat-icon>person</mat-icon>
          <div>{{ item.name }}</div>
        </div>
        @if (checkModule(item.id)) {
          <mat-icon>check</mat-icon>
        }
      </div>
    </button>
  } @empty {
    <div style="padding: 16px; text-align: center; color: gray;">
      Nenhum módulo disponível para este sistema.
    </div>
  }
  </mat-action-list>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Fechar</button>
</mat-dialog-actions>
