<mat-card class="login-card" appearance="raised">
  <mat-card-header>
    <div class="card-header-wrapper">
      <mat-card-subtitle>REDEFINIR SENHA</mat-card-subtitle>
    </div>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
      
      <!-- Nova Senha -->
      <mat-form-field appearance="outline">
        <mat-label>Nova Senha</mat-label>
        <input 
          matInput 
          [type]="hidePassword() ? 'password' : 'text'" 
          formControlName="password"
        >
        <button 
          mat-icon-button 
          matSuffix 
          type="button" 
          (click)="togglePasswordVisibility()" 
          [attr.aria-label]="'Ocultar senha'" 
          [attr.aria-pressed]="hidePassword()"
        >
          <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        @for (item of errorMessages['password']; track $index) {
          <mat-error [hidden]="!resetPasswordForm.get('password')?.hasError(item.type)">
            {{ item.message }}
          </mat-error>
        }
      </mat-form-field>

      <!-- Confirmar Nova Senha -->
      <mat-form-field appearance="outline">
        <mat-label>Confirmar Nova Senha</mat-label>
        <input 
          matInput 
          [type]="hideConfirmPassword() ? 'password' : 'text'" 
          formControlName="password_confirmation"
        >
        <button 
          mat-icon-button 
          matSuffix 
          type="button" 
          (click)="toggleConfirmPasswordVisibility()" 
          [attr.aria-label]="'Ocultar confirmação de senha'" 
          [attr.aria-pressed]="hideConfirmPassword()"
        >
          <mat-icon>{{ hideConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        @for (item of errorMessages['password_confirmation']; track $index) {
          <mat-error [hidden]="!resetPasswordForm.get('password_confirmation')?.hasError(item.type)">
            {{ item.message }}
          </mat-error>
        }
      </mat-form-field>

      <button 
        mat-flat-button 
        color="primary" 
        type="submit" 
        class="submit-button"
        [disabled]="resetPasswordForm.invalid || isSubmitting()"
      >
        <div class="waiting">
          @if (isSubmitting()) {
            <mat-spinner [diameter]="20"></mat-spinner>
          }
          <span>Redefinir Senha</span>
        </div>
      </button>

      <p class="forgot-password">
        Voltar para a tela inicial? 
        <button mat-button type="button" routerLink="/login" [disabled]="isSubmitting()">
          Clique aqui
        </button>
      </p>

    </form>
  </mat-card-content>
</mat-card>
