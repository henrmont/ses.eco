<mat-card class="login-card" appearance="raised">
  <mat-card-header>
    <div class="card-header-wrapper">
      <mat-card-subtitle>RECUPERAÇÃO DE SENHA</mat-card-subtitle>
    </div>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      
      <mat-form-field appearance="outline">
        <mat-label>E-mail institucional</mat-label>
        <input matInput type="email" formControlName="email" placeholder="nome@saude.mt.gov.br">
        <mat-icon matSuffix>alternate_email</mat-icon>
        @for (item of errorMessages['email']; track $index) {
          <mat-error [hidden]="!forgotPasswordForm.get('email')?.hasError(item.type)">
            {{ item.message }}
          </mat-error>
        }
      </mat-form-field>

      <button 
        mat-flat-button 
        color="primary" 
        type="submit" 
        class="submit-button"
        [disabled]="forgotPasswordForm.invalid || isSubmitting()"
      >
        <div class="waiting">
          @if (isSubmitting()) {
            <mat-spinner [diameter]="20"></mat-spinner>
          }
          <span>Enviar link de recuperação</span>
        </div>
      </button>

      <p class="forgot-password">
        Lembrou a senha? 
        <button mat-button type="button" routerLink="/login" [disabled]="isSubmitting()">
          Clique aqui
        </button>
      </p>

    </form>
  </mat-card-content>
</mat-card>
