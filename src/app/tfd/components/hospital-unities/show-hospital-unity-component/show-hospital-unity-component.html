<h2 mat-dialog-title>Detalhes da unidade hospitalar</h2>

<mat-dialog-content>
  <mat-card appearance="outlined">
    <mat-card-content style="display: flex; flex-direction: column; gap: 0.75rem;">
      <div class="line" style="display: grid; grid-template-columns: 1fr;">
        <div>
          <strong>Nome: </strong>{{ data?.hospital_unity?.name }}
        </div>
      </div>

      <div class="line" style="display: grid; grid-template-columns: 1fr;">
        <div>
          <strong>CNES: </strong>{{ data?.hospital_unity?.cnes }}
        </div>
      </div>

      <div class="line" style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
        <div>
          <strong>Cidade: </strong>{{ data?.hospital_unity?.city }}
        </div>
        <div>
          <strong>UF: </strong>{{ data?.hospital_unity?.state }}
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">Fechar</button>
</mat-dialog-actions>
