<h2 mat-dialog-title>Novo parecer</h2>

<form [formGroup]="opinionForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="stepper">
      
      <div class="line cols-1-1">
        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input matInput type="text" formControlName="name">
          
          @for (item of errorMessages['name']; track item.type) {
            <mat-error [hidden]="!opinionForm.get('name')?.hasError(item.type)">
              {{ item.message }}
            </mat-error>
          }
        </mat-form-field>

        <div class="toggle-cell">
          <mat-slide-toggle formControlName="is_approved">
            <span>Parecer favorável</span>
          </mat-slide-toggle>
        </div>
      </div>

      <div class="line cols-1-col my-custom-editor">
        <div class="NgxEditor__Wrapper" style="width: 100%;">
          <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"></ngx-editor-menu>
          <ngx-editor
            [editor]="editor"
            formControlName="content"
            placeholder="Parecer..."
            outputFormat="html"
          ></ngx-editor>
        </div>
        
        @for (item of errorMessages['content']; track item.type) {
          @if (opinionForm.get('content')?.touched && opinionForm.get('content')?.hasError(item.type)) {
            <small class="mat-mdc-form-field-error" style="color: #f44336; font-size: 75%; padding: 0 16px;">
              {{ item.message }}
            </small>
          }
        }
      </div>

    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [disabled]="isSubmitting()" [mat-dialog-close]="false">
      Cancelar
    </button>
    
    <button 
      mat-flat-button 
      color="primary" 
      type="submit" 
      [disabled]="opinionForm.invalid || opinionForm.pending || isSubmitting()"
    >
      <div class="waiting">
        @if (isSubmitting()) {
          <mat-spinner [diameter]="20"></mat-spinner>
        }
        <span>{{ isSubmitting() ? 'Criando...' : 'Criar' }}</span>
      </div>
    </button>
  </mat-dialog-actions>
</form>
