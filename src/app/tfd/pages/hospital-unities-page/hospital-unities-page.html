<section>
  <div class="search">
    <mat-form-field appearance="outline">
      <mat-label>Buscar</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Buscar unidade hospitalar" #input />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="dataSource()">
    <!-- Coluna Nome -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nome </th>
      <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
    </ng-container>

    <!-- Coluna CNES -->
    <ng-container matColumnDef="cnes">
      <th mat-header-cell *matHeaderCellDef> CNES </th>
      <td mat-cell *matCellDef="let element"> {{ element.cnes }} </td>
    </ng-container>

    <!-- Coluna Cidade -->
    <ng-container matColumnDef="city">
      <th mat-header-cell *matHeaderCellDef> Cidade </th>
      <td mat-cell *matCellDef="let element"> {{ element.city }} </td>
    </ng-container>

    <!-- Coluna UF -->
    <ng-container matColumnDef="uf">
      <th mat-header-cell *matHeaderCellDef style="width: 80px;"> UF </th>
      <td mat-cell *matCellDef="let element"> {{ element.state }} </td>
    </ng-container>

    <!-- Coluna Ações -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="center" style="width: 15%;"> Ações </th>
      <td mat-cell *matCellDef="let element" class="center">
        <div>
          <button 
            mat-icon-button 
            matTooltip="Detalhes da unidade hospitalar" 
            (click)="showHospitalUnity(element)">
            <mat-icon>visibility</mat-icon>
          </button>
          
          <button 
            mat-icon-button 
            matTooltip="Atualizar unidade hospitalar" 
            (click)="updateHospitalUnity(element)" 
            [disabled]="checkPermissions('tfd/unidade hospitalar atualizar')">
            <mat-icon>drive_file_rename_outline</mat-icon>
          </button>
          
          <button 
            mat-icon-button 
            matTooltip="Deletar unidade hospitalar" 
            (click)="deleteHospitalUnity(element)" 
            [disabled]="checkPermissions('tfd/unidade hospitalar deletar')">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell center" [attr.colspan]="displayedColumns.length">Nenhum resultado encontrado.</td>
    </tr>
  </table>
</section>
